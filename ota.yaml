version: 1
project:
  name: osf.io
  description: >
    Pressure slice for OSF's documented local Docker Compose development path, including staged
    dependency hydration, core infra startup, detached app/service startup, and destructive
    Postgres reset workflow.
execution:
  default_context: host
  contexts:
    host:
      backend: native
      requirements:
        tools:
          docker: "*"
services:
  postgres:
    manager:
      kind: compose
      name: osfio
      file: docker-compose.yml
      service: postgres
    endpoints:
      host:
        address: 127.0.0.1
        port: 5432
    readiness:
      kind: tcp
      from: host
tasks:
  requirements:up:
    context: host
    description: Run the documented requirements hydration containers for the local Docker stack
    notes: >
      Mirrors the README Docker Compose path `docker compose up requirements mfr_requirements
      wb_requirements gv_requirements`.
    compose:
      kind: up
      services:
        - requirements
        - mfr_requirements
        - wb_requirements
        - gv_requirements
    requirements:
      tools:
        docker: "*"
    effects:
      network: true
      network_kind: dependency_hydration
      external_state:
        - docker
    safe_for_agent: false
  core:up:
    context: host
    description: Start the documented core infra services for the OSF Docker stack
    notes: >
      Mirrors the README Docker Compose path `docker compose up -d elasticsearch postgres mongo
      rabbitmq`.
    compose:
      kind: up
      detach: true
      services:
        - elasticsearch
        - postgres
        - mongo
        - rabbitmq
    depends_on:
      - requirements:up
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
        - rabbitmq
        - elasticsearch
    safe_for_agent: false
  assets:up:
    context: host
    description: Start the documented detached asset watcher containers
    notes: >
      Mirrors the README Docker Compose path `docker compose up -d assets admin_assets`. The docs
      also recommend clearing local `node_modules` before first startup; that housekeeping remains
      repo truth outside the current Ota contract surface.
    compose:
      kind: up
      detach: true
      services:
        - assets
        - admin_assets
    depends_on:
      - requirements:up
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
    safe_for_agent: false
  supporting:up:
    context: host
    description: Start the documented supporting detached app services
    notes: >
      Mirrors the README Docker Compose path `docker compose up -d mfr wb fakecas sharejs`.
    compose:
      kind: up
      detach: true
      services:
        - mfr
        - wb
        - fakecas
        - sharejs
    depends_on:
      - core:up
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
    safe_for_agent: false
  db:migrate:
    context: host
    description: Run the documented OSF Django migration command inside a disposable web container
    notes: >
      Mirrors the README command `docker compose run --rm web python3 manage.py migrate`.
    compose:
      kind: run
      service: web
      rm: true
      exe: python3
      args:
        - manage.py
        - migrate
    depends_on:
      - core:up
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
    safe_for_agent: false
  postgres:up:
    context: host
    description: Start the documented local Postgres Compose service
    notes: Mirrors the README Docker Compose path for bringing up the local Postgres container.
    compose:
      kind: up
      detach: true
      services:
        - postgres
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
  postgres:reset:
    context: host
    description: Reset the documented local Postgres data volume and restart the Compose service
    notes: >
      Mirrors the README Docker Compose volume reset path: stop postgres, remove the postgres
      container, remove the `osfio_postgres_data_vol` volume, then start postgres again.
    action:
      kind: reset_compose_service_volume
      service: postgres
      volume: osfio_postgres_data_vol
      compose:
        files:
          - docker-compose.yml
        project_name: osfio
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
    safe_for_agent: false
  db:reset:
    context: host
    description: Run the documented Django database reset command inside the web container
    notes: >
      Mirrors the README command `docker compose run --rm web python3 manage.py reset_db
      --noinput`.
    compose:
      kind: run
      service: web
      rm: true
      exe: python3
      args:
        - manage.py
        - reset_db
        - --noinput
    depends_on:
      - postgres:up
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
    safe_for_agent: false
  app:up:
    context: host
    description: Start the documented detached OSF app and worker services
    notes: >
      Mirrors the README Docker Compose path `docker compose up -d worker web api admin preprints
      gv`.
    compose:
      kind: up
      detach: true
      services:
        - worker
        - web
        - api
        - admin
        - preprints
        - gv
    depends_on:
      - supporting:up
      - assets:up
    requirements:
      tools:
        docker: "*"
    effects:
      external_state:
        - docker
        - postgres
        - rabbitmq
        - elasticsearch
    runtime:
      kind: service
      readiness:
        kind: http
        listener: web:http
        path: /
        interval: 5s
        timeout: 5s
        retries: 60
        start_period: 15s
      listeners:
        web:http:
          protocol: http
          bind:
            address: 0.0.0.0
            port:
              mode: fixed
              value: 5000
          project:
            host:
              address: 127.0.0.1
              port:
                mode: fixed
                value: 5000
              path: /
              primary: true
            publication:
              compose:
                service: web
    safe_for_agent: false
workflows:
  default: local-postgres
  local-postgres:
    intent: local_development
    description: Documented local Postgres startup and reset slice for OSF Docker development
    prepare:
      task: postgres:up
  local-docker:
    intent: local_development
    description: >
      Documented staged OSF Docker Compose startup path covering requirements hydration, core infra,
      detached asset watchers, supporting services, and the detached app stack rooted at the web
      service on localhost:5000.
    run:
      task: app:up
agent:
  posture: readiness_strict
  entrypoint: postgres:up
  default_task: postgres:up
  protected_paths:
    - .github/workflows
    - docker-compose.yml
    - ota.yaml
  bootstrap:
    ota:
      note: Install ota only when missing so contributors and agents can use the readiness workflows declared here.
      source:
        kind: branch
        branch: 1.6.22-implementation
  notes: |
    This contract intentionally scopes OSF to the documented local Docker Compose development path and
    the narrower Postgres maintenance slice, not every optional OSF Docker workflow.
    Review `ota tasks --use` before execution; the modeled tasks mutate Docker or database state and are
    not declared agent-safe by default.
    Use `ota up --workflow local-postgres` for the documented startup path.
    Use `ota up --workflow local-docker` for the staged full local Docker Compose startup path.
metadata:
  ota:
    minimum_version: "1.6.22"
